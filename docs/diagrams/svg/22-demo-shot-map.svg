 conduct                 </text><text id="l5-text" font-size="13" x="448" y="325.5" class="taskTextOutsideLeft taskTextOutside2  critText2">Runtime killed on camera, resumes, one email   </text><text id="m2-text" font-size="13" x="523" y="351.5" class="taskTextOutsideRight taskTextOutside2  critText2 milestoneText width-153.90625">PILLAR 2 · kill and resume                     </text><text id="l6-text" font-size="13" x="529" y="377.5" class="taskTextOutsideLeft taskTextOutside2  critText2">The CISO approves at the gate                  </text><text id="m3-text" font-size="13" x="590" y="403.5" class="taskTextOutsideLeft taskTextOutside2  critText2 milestoneText">PILLAR 3 · the human gate                      </text><text id="p1-text" font-size="13" x="583" y="429.5" class="taskTextOutsideLeft taskTextOutside3">Binder export, detection table, console montage</text><text id="m4-text" font-size="13" x="599" y="455.5" class="taskTextOutsideLeft taskTextOutside3  critText3 milestoneText">PILLAR 4 · the audit binder                    </text><text id="p2-text" font-size="13" x="650" y="481.5" class="taskTextOutsideLeft taskTextOutside3">Metrics card and close                         </text></g><g><text dy="0em" x="10" y="76" font-size="15" class="sectionTitle sectionTitle0"><tspan alignment-baseline="central" x="10">Cold open</tspan></text><text dy="0em" x="10" y="128" font-size="15" class="sectionTitle sectionTitle1"><tspan alignment-baseline="central" x="10">Setup</tspan></text><text dy="0em" x="10" y="284" font-size="15" class="sectionTitle sectionTitle2"><tspan alignment-baseline="central" x="10">Live segment</tspan></text><text dy="0em" x="10" y="453" font-size="15" class="sectionTitle sectionTitle3"><tspan alignment-baseline="central" x="10">Proof</tspan></text></g><text x="392" y="25" class="titleText">Target 3.55 · the core segment from 1.20 to 3.10 is one unbroken live take · record three, on three different days</text></svg>