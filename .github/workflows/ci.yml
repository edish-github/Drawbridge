name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# No cloud calls and no model calls anywhere in this workflow. It must stay free to run on
# every push, so the corpus run — the one job worth spending real model calls on — is a
# separate scheduled workflow rather than part of this one.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install emulators
        run: gcloud components install cloud-firestore-emulator pubsub-emulator beta --quiet

      - name: Start emulators
        run: ./scripts/emulators.sh
        env:
          PROJECT_ID: drawbridge-ci

      - name: Lint
        run: ruff check .

      - name: Test
        # No model call and no cloud call: the emulators need no credentials and no billing
        # account, so the resume and idempotency suites run on every push for free.
        run: pytest -q
        env:
          RUNTIME_MODE: local
          GEMINI_API_KEY: ci-placeholder-no-model-calls
          FIRESTORE_EMULATOR_HOST: localhost:8080
          PUBSUB_EMULATOR_HOST: localhost:8085

  contracts:
    runs-on: ubuntu-latest
    # Checks that documented contracts and provisioned reality cannot drift apart. Each of
    # these was a real bug class before it was a CI job.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Topic list matches across code, config and bootstrap
        run: python scripts/check_contracts.py --check topics

      - name: Rubric weights sum to 100
        run: python scripts/check_contracts.py --check rubric

      - name: Question bank contains no yes/no questions
        run: python scripts/check_contracts.py --check bank

      - name: Permission matrix and generated rules agree
        run: python scripts/check_contracts.py --check iam

      - name: No public route reaches the model router
        run: python scripts/check_contracts.py --check public-routes
